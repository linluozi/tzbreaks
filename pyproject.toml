[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tzbreaks"
version = "1.0.0"
description = "Enumerate and classify time-zone gaps/overlaps; never silently guess a wall clock"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["timezone", "dst", "zoneinfo", "scheduling", "calendar"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
tzbreaks = "tzbreaks.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
